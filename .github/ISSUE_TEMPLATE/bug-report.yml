name: Bug report
description: Report an AgentMeter problem with Codex or Claude Code monitoring.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not upload credentials, auth files, API keys, tokens, cookies, private prompts/responses, source code, or full terminal history. No serial numbers. Review screenshots and logs before attaching them."
  - type: input
    id: app-version
    attributes:
      label: AgentMeter version
    validations:
      required: true
  - type: input
    id: macos-version
    attributes:
      label: macOS version
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Mac model
      description: "For example, MacBook Air M2. Do not include a serial number."
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Architecture
      options: [Apple Silicon, Intel, Unknown]
    validations:
      required: true
  - type: dropdown
    id: notch
    attributes:
      label: Built-in display has a notch
      options: ['Yes', 'No', Unknown]
    validations:
      required: true
  - type: dropdown
    id: external-display
    attributes:
      label: External display connected
      options: ['Yes', 'No']
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: Codex or Claude Code version
      description: "Include versions for each affected CLI or desktop app."
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      options: [CLI, Desktop, Both, Neither]
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Optional sanitized screenshot or diagnostics
      description: "No private content, authentication material, or full terminal history."
