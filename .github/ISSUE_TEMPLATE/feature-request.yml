name: Feature request
description: Suggest a focused product improvement.
labels: [enhancement]
body:
  - type: dropdown
    id: platform
    attributes:
      label: Platforms affected
      options: [Both platforms, macOS, Windows]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior and platform considerations
      description: "Consider the shared product specification and explain any native platform differences."
    validations:
      required: true
